name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate application
        run: npm test
      - name: Detect Pages publishing source
        id: pages_source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PAGES_SOURCE=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)
          echo "type=${PAGES_SOURCE}" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        if: steps.pages_source.outputs.type == 'workflow'
        uses: actions/configure-pages@v5
      - name: Upload static application
        if: steps.pages_source.outputs.type == 'workflow'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        if: steps.pages_source.outputs.type == 'workflow'
        uses: actions/deploy-pages@v4
